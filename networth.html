<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Worth | Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="/">Transactions</a>
        <a href="/networth">Net Worth</a>
    </nav>
    <h1>Net Worth Tracker 🏦</h1>

    <div id="networth-summary">
        <div>
            <h2>Total Assets</h2>
            <p id="total-assets">$0.00</p>
        </div>
        <div>
            <h2>Total Liabilities</h2>
            <p id="total-liabilities">$0.00</p>
        </div>
        <div>
            <h2>Net Worth</h2>
            <p id="final-net-worth">$0.00</p>
        </div>
    </div>

    <div class="container">
        <h2>Items</h2>
        <table id="networth-table">
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Actions</th> </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
    
    <div class="container-split">
        <div class="panel">
            <h2>Assets</h2>
            <form id="asset-form">
                <input type="text" id="asset-description" placeholder="e.g., Savings Account" required>
                <input type="number" id="asset-amount" placeholder="Amount" required>
                <button type="submit" id="asset-submit">Add Asset</button>
            </form>
            <table id="asset-table">
                <thead><tr><th>Description</th><th>Amount</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="panel">
            <h2>Liabilities</h2>
            <form id="liability-form">
                <input type="text" id="liability-description" placeholder="e.g., Credit Card" required>
                <input type="number" id="liability-amount" placeholder="Amount" required>
                <button type="submit">Add Liability</button>
            </form>
            <table id="liability-table">
                <thead><tr><th>Description</th><th>Amount</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="networth.js"></script>
</body>
</html>
